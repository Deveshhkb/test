# One-command local stack:  docker compose up --build
# Then seed once:           docker compose run --rm seed
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '5000'
      MONGODB_URI: mongodb://mongo:27017/novastyle
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      FRONTEND_URL: http://localhost:3000
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - '5000:5000'

  # One-off seeder: `docker compose run --rm seed`
  seed:
    build: ./apps/backend
    profiles: ['tools']
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/novastyle
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    command: ['node', 'src/seed/seed.js']

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    restart: unless-stopped
    # Server-side (SSR) fetches reach the API over the compose network.
    environment:
      INTERNAL_API_URL: http://backend:5000/api
    depends_on:
      - backend
    ports:
      - '3000:3000'

  admin:
    build:
      context: ./apps/admin
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3001:3001'

volumes:
  mongo-data:
