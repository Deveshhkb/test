<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover + the safe-area env() vars in the stylesheet let the
      canvas run edge to edge on notched devices while the LayoutManager keeps
      interactive UI clear of the unsafe regions.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a1410" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Roulette</title>
    <!-- Inline so a standalone build has zero network requests of its own. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230f5132' stroke='%23e8c96a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e8c96a'/%3E%3Ccircle cx='16' cy='5.5' r='2.5' fill='%23f6f2e8'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #07100c;
        /* Kill the 300ms tap delay and iOS double-tap zoom on the table. */
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      #game-root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #game-root canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
