        // Additional code to track progress for specific resources (e.g., images)
        var loadedResources = 0;
        const gameAssets = [
           '',

  var totalResources = gameAssets.length;
  async function simulateLoading() {
    for (let asset of gameAssets) {
      await loadSingleAsset(asset);
      loadedResources++;
      const percentage = Math.floor((loadedResources / totalResources) * 100);
      updateLoadingBar(percentage);
    }

    isloadingComplete = true;
    load_index();
  }

  function loadSingleAsset(src) {
    return new Promise((resolve) => {
      const ext = src.split('.').pop().toLowerCase();

      if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) {
        const img = new Image();
        img.onload = img.onerror = resolve;
        img.src = src;
      } else if (ext === 'js') {
        const script = document.createElement('script');
        script.src = src;
        script.onload = script.onerror = resolve;
        document.head.appendChild(script);
      } else {
        // Other file types (like JSON, etc.)
        fetch(src).then(resolve).catch(resolve);
      }
    });
  }

        const overlay = document.getElementById('scrolling');
        var initialTouchY = null;
            var initialHeight = overlay.clientHeight;
            var minHeight = 100;
           
            overlay.addEventListener('touchstart', function(event) {
                initialTouchY = event.touches[0].clientY;
            });

            overlay.addEventListener('touchmove', function(event) {
                if (initialTouchY !== null) {
                    var touchY = event.touches[0].clientY;
                    var touchDeltaY = initialTouchY - touchY;

                    var newHeight = initialHeight + touchDeltaY;
                    if (newHeight >= minHeight && newHeight <= 300 * window.innerHeight / 100) {
                        overlay.style.height = `${newHeight}px`;
                    }
                }
            });

            overlay.addEventListener('touchend', function(event) {
                initialTouchY = null;
                initialHeight = overlay.clientHeight;
                //document.getElementById("hsize").innerHTML = initialHeight + " " + overlay.style.height + " " +window.innerHeight;
                if(window.innerHeight > 460){
                    if (overlay.clientHeight >= window.innerHeight - 50) {
                        document.getElementById("fullscreen-loading-patch").style.display = "none";

                    } else if (overlay.clientHeight <= minHeight) {
                        alert('Overlay is at minimum height');
                    } else {
                        alert('not full screen or minimum height');
                    }
                }
                
            });

        function fillDiv(div, proportional) {
            
            var currentWidth = div.outerWidth();
            var currentHeight = div.outerHeight();

            var availableHeight = window.innerHeight;
            var availableWidth = window.innerWidth;

            var scaleX = availableWidth / currentWidth;
            var scaleY = availableHeight / currentHeight;

            if (proportional) {
                scaleX = Math.min(scaleX, scaleY);
                scaleY = scaleX;
            }
            // div.css({width:scaleX});
            var translationX = Math.round((availableWidth - currentWidth * scaleX) / 2);
            var translationY = Math.round((availableHeight - currentHeight * scaleY) / 2);

            var newScale = Math.min(scaleX, scaleY);
            var prevScale = div.data('prevScale');
            var tolerance = 0.01;


            if (prevScale !== undefined) {
               // var prevScale = div.data('prevScale');
                if (newScale > prevScale + tolerance) {
                    div.data('scaleStatus', 'up');
                    //alert("up");
                    if (getBrowser.isIOS) {
                        isFullScreenios = true;
                        //document.getElementById("hsize").innerHTML = initialViewportHeight + " " + window.innerHeight;
                        if(myOrientation == "landscape"){
                            document.getElementById("fullscreen-loading-patch").style.display = "none";
                        }   
                    }
                } else if (newScale < prevScale - tolerance) {
                    div.data('scaleStatus', 'down');
                    if (getBrowser.isIOS) {
                        //isFullScreenios = false;
                        
                        resetOverlay();
                        //alert("fill");
                        if(isTypeMsg){
                            return;
                        }
                        document.getElementById("fullscreen-loading-patch").style.display = "block";
                        document.getElementById("android-hand-cursor").style.display = "none";
                        document.getElementById("ios-hand-cursor").style.display = "block";
                        document.getElementById("fullscreen-loading-patch").style.zIndex = "99999";

                        //document.getElementById("hsize").innerHTML = "BLOCK";
                    }
                } else {
                    div.data('scaleStatus', 'unchanged');
                }
            }
            // Store the current scale for the next comparison
            div.data('prevScale', newScale);
            
            div.css({
                position: "fixed",
                left: "0px",
                top: "0px",
                "-webkit-transform": "translate(" +
                    translationX +
                    "px, " +
                    translationY +
                    "px) scale3d(" +
                    scaleX +
                    ", " +
                    scaleY +
                    ", 1)",
                "-webkit-transform-origin": "0 0",
            });
        }
